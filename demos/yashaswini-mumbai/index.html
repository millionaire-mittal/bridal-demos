<style>
/* Codzo Bridal Engine: shared styles. Colours and fonts are overridden per client from config.js */

:root{
  --ivory:#FAF6F1; --blush:#EFDDD5; --blush-2:#F5E8E2; --peach:#C9846A; --peach-d:#A9664D;
  --ink:#3B2A26; --taupe:#6B5751; --olive:#3F4A35; --olive-2:#4C5842; --sage:#8C977A; --silk:#EAD2C7; --silk-edge:#C49A8A;
  --ease:cubic-bezier(.22,1,.36,1);
  --display:'Bodoni Moda', 'Didot', 'Bodoni 72', Georgia, serif;
  --script:'Italianno', 'Snell Roundhand', cursive;
  --body:'Jost', 'Avenir Next', 'Helvetica Neue', Arial, sans-serif;
  --wrap:1240px; --pad:clamp(20px, 5vw, 72px);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html.rm{scroll-behavior:auto}
body{margin:0;background:var(--ivory);color:var(--ink);font-family:var(--body);font-weight:300;font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
a{color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;letter-spacing:-.01em}
p{margin:0}
.skip{position:absolute;left:-999px;top:8px;background:var(--ink);color:var(--ivory);padding:10px 16px;z-index:200}
.skip:focus{left:8px}
:focus-visible{outline:2px solid var(--peach-d);outline-offset:3px}

main{position:relative;overflow-x:clip}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 var(--pad)}
.z{position:relative;z-index:2}
section{position:relative}
.blush{background:var(--blush)}

/* ---------- type helpers ---------- */
.eyebrow,.chap,.label{font-family:var(--body);font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:400;color:var(--taupe)}
.chap{display:flex;align-items:center;gap:14px;margin-bottom:28px}
.chap .num{font-family:var(--display);font-style:italic;text-transform:none;letter-spacing:0;font-size:22px;color:var(--olive)}
.chap .ln{width:44px;height:1px;background:var(--sage)}
.script{font-family:var(--script);font-weight:400;letter-spacing:0;color:var(--peach-d)}
h2{font-size:clamp(40px,5.4vw,78px);line-height:1.02}
h2 em,h1 em,.pull-text em{font-style:italic}
.sub-it{font-family:var(--display);font-style:italic;font-size:20px;color:var(--taupe)}
.body p+p{margin-top:16px}
.ph{border-bottom:1px dashed var(--peach);color:var(--peach-d);padding:0 2px;white-space:nowrap}

/* ---------- buttons ---------- */
.btn{position:relative;display:inline-flex;align-items:center;gap:12px;min-height:48px;padding:0 26px 0 22px;border-radius:999px;background:var(--ink);color:var(--ivory);text-decoration:none;font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:400;overflow:hidden;isolation:isolate;border:0;cursor:pointer;font-family:var(--body);transition:color .4s var(--ease)}
.btn .dot{width:7px;height:7px;border-radius:50%;background:var(--peach);flex:none;position:relative}
.btn .dot::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--blush);transform:scale(0);transition:transform .55s var(--ease);z-index:-1}
.btn:hover,.btn:focus-visible{color:var(--ink)}
.btn:hover .dot::after,.btn:focus-visible .dot::after{transform:scale(70)}
.btn span{position:relative}
.btn-ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.btn-ghost .dot::after{background:var(--ink)}
.btn-ghost:hover,.btn-ghost:focus-visible{color:var(--ivory)}
.btn-sm{min-height:44px;padding:0 20px 0 18px;font-size:11px}
.link{font-size:12px;letter-spacing:.2em;text-transform:uppercase;text-decoration:none;padding:6px 0;background:linear-gradient(var(--ink),var(--ink)) left bottom/100% 1px no-repeat;transition:background-size .5s var(--ease)}
.link:hover{background-size:30% 1px}

/* ---------- nav ---------- */
.nav{position:fixed;inset:0 0 auto 0;z-index:100;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:14px var(--pad);transition:background .5s var(--ease),box-shadow .5s var(--ease)}
.nav.scrolled{background:rgba(245,232,226,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 1px 0 rgba(140,151,122,.25)}
.brand{display:flex;flex-direction:column;align-items:center;text-decoration:none;line-height:1}
.brand .b1{font-family:var(--display);font-size:22px;letter-spacing:.14em}
.brand .b2{font-size:8.5px;letter-spacing:.62em;margin-top:5px;margin-right:-.62em}
.nav nav{display:flex;gap:30px}
.nav nav a{font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;text-decoration:none;padding:8px 0;color:var(--ink);background:linear-gradient(var(--peach),var(--peach)) left bottom/0 1px no-repeat;transition:background-size .5s var(--ease)}
.nav nav a:hover{background-size:100% 1px}

/* ---------- arch ---------- */
.arch-wrap{position:relative;margin:0;isolation:isolate}
.arch-wrap::before{content:"";position:absolute;inset:0;border:1px solid var(--sage);border-radius:999px 999px 0 0;transform:translate(14px,-14px);z-index:-1;transition:transform 1.2s var(--ease) .35s,opacity 1.2s var(--ease) .35s}
.arch{position:relative;overflow:hidden;border-radius:999px 999px 0 0;background:var(--blush-2);height:100%}
.arch img{width:100%;height:100%;object-fit:cover;transition:transform 1.8s var(--ease)}
.frame{position:relative;isolation:isolate;margin:0}
.frame::before{content:"";position:absolute;inset:0;border:1px solid var(--sage);transform:translate(12px,-12px);z-index:-1;transition:transform 1.2s var(--ease) .3s,opacity 1.2s var(--ease) .3s}
.frame .ph-img{overflow:hidden;background:var(--blush-2)}
.frame img{width:100%;height:100%;object-fit:cover;transition:transform 1.8s var(--ease),filter 1.4s var(--ease)}

html.js:not(.rm) [data-reveal] .arch,html.js:not(.rm) [data-reveal] .ph-img{clip-path:inset(100% 0 0 0);transition:clip-path 1.3s var(--ease)}
html.js:not(.rm) [data-reveal] img{transform:scale(1.14)}
html.js:not(.rm) [data-reveal]::before{opacity:0;transform:translate(0,0)}
html.js:not(.rm) [data-reveal].in .arch,html.js:not(.rm) [data-reveal].in .ph-img{clip-path:inset(0 0 0 0)}
html.js:not(.rm) [data-reveal].in img{transform:scale(1)}
html.js:not(.rm) [data-reveal].in::before{opacity:1}
html.js:not(.rm) .arch-wrap[data-reveal].in::before{transform:translate(14px,-14px)}
html.js:not(.rm) .frame[data-reveal].in::before{transform:translate(12px,-12px)}
html.js:not(.rm) .frame[data-reveal] img{filter:blur(8px)}
html.js:not(.rm) .frame[data-reveal].in img{filter:blur(0)}

html.js:not(.rm) [data-fade]{opacity:0;transform:translateY(24px);transition:opacity 1s var(--ease),transform 1s var(--ease);transition-delay:var(--d,0ms)}
html.js:not(.rm) [data-fade].in{opacity:1;transform:none}

/* word un-blur */
.w{display:inline-block}
html.js:not(.rm) [data-blur] .w{filter:blur(12px);opacity:.15;transform:translateY(.12em);transition:filter 1.1s var(--ease),opacity 1.1s var(--ease),transform 1.1s var(--ease);transition-delay:calc(var(--i) * 75ms)}
html.js:not(.rm) [data-blur].in .w{filter:blur(0);opacity:1;transform:none}

/* botanicals */
.bot{position:absolute;pointer-events:none;overflow:visible}
.bot path,.bot circle,.bot ellipse{fill:none;stroke:var(--sage);stroke-width:1.1;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
.bot .rib{stroke-width:.8;opacity:.7}
.bot .fruit{stroke:var(--olive-2)}
.bot .petal-fill{fill:var(--silk);fill-opacity:0;transition:fill-opacity 1.6s var(--ease) 1.4s}
.bot.in .petal-fill{fill-opacity:.85}
html.js:not(.rm) .bot path,html.js:not(.rm) .bot circle,html.js:not(.rm) .bot ellipse{stroke-dasharray:1 1;stroke-dashoffset:1;transition:stroke-dashoffset 1.7s var(--ease) calc(var(--i) * 45ms)}
html.js:not(.rm) .bot.in path,html.js:not(.rm) .bot.in circle,html.js:not(.rm) .bot.in ellipse{stroke-dashoffset:0}

/* ribbon */
#ribbon{position:absolute;left:0;top:0;width:100%;z-index:1;pointer-events:none;overflow:visible}
#ribbon .band{fill:none;stroke:var(--silk);stroke-width:7;stroke-linecap:round;stroke-linejoin:round;opacity:.95}
#ribbon .edge{fill:none;stroke:var(--silk-edge);stroke-width:1;stroke-linecap:round;opacity:.75}
#ribbon .edge2{fill:none;stroke:var(--silk-edge);stroke-width:.8;stroke-linecap:round;opacity:.45}
.rp{position:absolute;left:0;width:1px;height:1px;pointer-events:none}

/* ---------- hero ---------- */
.hero{min-height:100vh;padding:130px 0 90px;display:flex;align-items:center}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center;width:100%}
.hero h1{font-size:clamp(68px,10vw,156px);line-height:.92;margin:26px 0 30px}
.hero h1 .script{font-size:1.12em;display:inline-block;margin-right:.08em;line-height:.8}
.hero .lead{font-family:var(--display);font-size:clamp(20px,1.8vw,25px);line-height:1.45;max-width:30ch;color:var(--ink)}
.cta-row{display:flex;align-items:center;gap:30px;margin-top:38px;flex-wrap:wrap}
.hero .meta{margin-top:44px;font-size:13px;color:var(--taupe);display:flex;gap:10px 18px;flex-wrap:wrap}
.hero .meta span+span::before{content:"·";margin-right:18px;color:var(--sage)}
.hero-art{position:relative;height:min(78vh,720px);display:flex;justify-content:center;align-items:flex-end}
.hero-arch{width:min(400px,78%);height:94%}
.hero-mini{position:absolute;width:150px;height:200px;left:2%;bottom:-6%}
.hero-mini .arch{border:6px solid var(--ivory)}
.hero-art .bot{inset:-6% -10% -4% -14%;width:124%;height:110%;z-index:-1}
.hero-cap{position:absolute;right:0;bottom:-34px;font-family:var(--display);font-style:italic;font-size:15px;color:var(--taupe)}
.scroll-cue{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--taupe);display:flex;flex-direction:column;align-items:center;gap:10px}
.scroll-cue i{width:1px;height:44px;background:linear-gradient(var(--sage) 50%,transparent 50%) 0 0/1px 200%;animation:cue 2.4s var(--ease) infinite}
@keyframes cue{from{background-position:0 100%}to{background-position:0 -100%}}

/* ---------- pull + olive tree ---------- */
.pull{padding:120px 0 120px}
.pull-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(30px,5vw,80px);align-items:center}
.pull .label{margin-bottom:30px}
.pull-text{font-family:var(--display);font-size:clamp(34px,4vw,60px);line-height:1.12}
.pull-text em{color:var(--peach-d)}
.roots{margin-top:34px;max-width:42ch;color:var(--taupe);font-size:16px}
.roots .script{font-size:40px;line-height:.6;margin-right:8px;vertical-align:-4px}
.tree-wrap{position:relative;height:min(660px,78vh)}
.tree{width:100%;height:100%;overflow:visible;display:block}
.tree path,.tree ellipse,.tree circle{fill:none;stroke:var(--sage);stroke-width:1.1;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
.tree .t0{stroke-width:1.5}.tree .t1{stroke-width:1.3}
.tree .bark{stroke-width:.8;opacity:.6}
.tree .gr{stroke:#B7AE9C}
.tree .fr{stroke:var(--olive-2)}
.tree .pf{fill:var(--silk);stroke:var(--silk-edge)}
.tree .lf{fill:var(--sage);fill-opacity:0}
html.js:not(.rm) .tree path,html.js:not(.rm) .tree ellipse,html.js:not(.rm) .tree circle{stroke-dasharray:1 1;stroke-dashoffset:1}
.tree .sway{transform-box:view-box;transform-origin:300px 440px;animation:sway 7s ease-in-out infinite alternate}
.tree .gust{transform-box:view-box;transform-origin:300px 440px}
@keyframes sway{from{transform:rotate(-.7deg)}to{transform:rotate(.7deg)}}
html.rm .tree .sway{animation:none}

/* ---------- uno ---------- */
.uno{padding:150px 0 170px}
.uno-grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(40px,7vw,110px);align-items:center}
.uno-photos{position:relative;height:640px}
.uno-arch{position:absolute;right:6%;top:40px;width:62%;height:560px}
.uno-small{position:absolute;left:0;bottom:0;width:42%;height:280px}
.uno-small .ph-img{height:100%;border:7px solid var(--blush)}
.uno-photos .bot{right:-12%;top:-30px;width:70%;height:240px;z-index:4}
.uno h2{margin-bottom:12px}
.uno .sub-it{margin-bottom:30px}
.uno .body{max-width:48ch;color:var(--ink)}
.signature{font-family:var(--script);font-size:64px;color:var(--peach-d);line-height:1;margin:26px 0 30px;display:block}
.photo-note{font-size:12px;color:var(--taupe);margin-top:14px;font-style:italic}

/* ---------- journey (pinned) ---------- */
.journey{height:var(--jh,440vh)}
.j-sticky{position:sticky;top:0;height:100vh;z-index:2;display:flex;align-items:center;padding-top:70px}
.j-grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,5fr) minmax(0,2.2fr);grid-template-rows:auto 1fr;gap:20px 56px;width:100%;height:calc(100vh - 120px);max-height:820px}
.j-head{grid-column:1 / -1;display:flex;align-items:flex-end;justify-content:space-between;gap:30px}
.j-head .chap{margin-bottom:12px}
.j-head h2{font-size:clamp(36px,4.2vw,62px)}
.j-count{font-family:var(--display);font-style:italic;font-size:20px;color:var(--taupe);white-space:nowrap}
.j-art{position:relative;min-height:0}
.j-art .arch-wrap{position:absolute;inset:0 6% 0 14%}
.j-art .arch{background:var(--blush)}
.j-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;clip-path:circle(0% at 50% 62%);transition:clip-path 1.1s var(--ease),transform 6s linear}
.j-img.on{clip-path:circle(120% at 50% 62%)}
.j-img.cur{transform:scale(1.06)}
.j-art .bot{left:-6%;bottom:-2%;width:40%;height:80%;z-index:3}
.j-text{position:relative;align-self:center;min-height:360px}
.j-panel{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center}
html.js:not(.rm) .j-panel{opacity:0;filter:blur(8px);transform:translateY(18px);transition:opacity .8s var(--ease),filter .8s var(--ease),transform .8s var(--ease);pointer-events:none}
html.js .j-panel.on{opacity:1;filter:none;transform:none;pointer-events:auto}
html.rm .j-panel{opacity:0}
html.rm .j-panel.on{opacity:1}
.j-n{font-family:var(--display);font-style:italic;font-size:18px;color:var(--peach-d);margin-bottom:12px}
.j-panel h3{font-size:clamp(30px,3vw,44px);line-height:1.08;margin-bottom:18px}
.j-panel p.d{max-width:40ch}
.j-panel blockquote{margin:28px 0 0;padding-left:20px;border-left:1px solid var(--sage);font-family:var(--display);font-style:italic;font-size:19px;line-height:1.5;max-width:40ch}
.j-panel cite{display:block;margin-top:10px;font-family:var(--body);font-style:normal;font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--taupe)}
.j-mimg{display:none}
.j-steps{list-style:none;margin:0;padding:0 0 0 22px;align-self:center;position:relative;border-left:1px solid rgba(140,151,122,.45)}
.j-steps li+li{margin-top:6px}
.j-steps button{background:none;border:0;padding:10px 0;font:inherit;font-family:var(--display);font-size:17px;color:var(--taupe);cursor:pointer;text-align:left;transition:color .4s var(--ease)}
.j-steps button.on{color:var(--ink)}
.j-steps button.on span{background:linear-gradient(var(--peach),var(--peach)) left 92%/100% 1px no-repeat}
.j-pointer{color:var(--peach);position:absolute;left:-6px;top:0;width:11px;height:11px;transition:transform .7s var(--ease)}
.j-pointer svg{display:block;width:11px;height:11px}
.j-fill{position:absolute;left:-1px;top:0;width:1px;background:var(--peach);height:0}

/* ---------- reels ---------- */
.reels{height:auto}
.r-sticky{position:sticky;top:0;height:100vh;overflow:hidden;z-index:2;display:flex;flex-direction:column;justify-content:center;padding-top:60px}
.r-head{display:flex;justify-content:space-between;align-items:flex-end;gap:40px;margin-bottom:46px;width:100%}
.r-head p{max-width:36ch;color:var(--taupe)}
.r-track{display:flex;gap:34px;padding:0 var(--pad);will-change:transform;width:max-content}
.reel{flex:none;width:clamp(240px,21vw,300px);margin:0}
.reel .arch{height:clamp(340px,52vh,470px);border-radius:999px 999px 0 0;position:relative}
.reel img{animation:kb 14s ease-in-out infinite alternate}
.reel:nth-child(2n) img{animation-delay:-6s}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.12) translateY(-2%)}}
html.rm .reel img{animation:none}
.play{color:var(--ink);position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;border:0;background:rgba(250,246,241,.92);display:grid;place-items:center;cursor:pointer;transition:transform .5s var(--ease)}
.play:hover{transform:scale(1.08)}
.play svg{width:18px;height:18px;margin-left:3px}
.reel figcaption{display:flex;justify-content:space-between;align-items:baseline;margin-top:16px;gap:10px}
.reel figcaption b{font-family:var(--display);font-weight:400;font-size:19px}
.reel figcaption span{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--taupe)}
.reel .soon{position:absolute;left:12px;right:12px;bottom:12px;background:rgba(59,42,38,.82);color:var(--ivory);font-size:12.5px;padding:10px 12px;opacity:0;transform:translateY(8px);transition:opacity .4s var(--ease),transform .4s var(--ease)}
.reel.show .soon{opacity:1;transform:none}

/* ---------- words ---------- */
.words{padding:150px 0 160px}
.w-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:clamp(40px,7vw,110px);align-items:center}
.w-photos{position:relative;height:560px}
.w-arch{position:absolute;left:0;top:0;width:78%;height:470px}
.w-small{position:absolute;right:0;bottom:0;width:46%;height:200px}
.w-small .ph-img{height:100%;border:7px solid var(--blush)}
.w-stage{position:relative;min-height:330px;margin-top:10px}
.quote{position:absolute;inset:0;margin:0}
.quote p{font-family:var(--display);font-size:clamp(26px,2.6vw,38px);line-height:1.28}
.quote p::before{content:"“";font-family:var(--display);color:var(--peach);margin-left:-.5em;padding-right:.08em}
.quote footer{margin-top:26px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--taupe)}
html.js .quote{opacity:0;pointer-events:none}
html.js .quote.on{opacity:1;pointer-events:auto}
html.js:not(.rm) .quote .w{filter:blur(10px);opacity:0;transition:filter .9s var(--ease),opacity .9s var(--ease);transition-delay:calc(var(--i) * 28ms)}
html.js:not(.rm) .quote.on .w{filter:none;opacity:1}
.w-ctrl{display:flex;align-items:center;gap:18px;margin-top:30px}
.w-ctrl button.arrow{width:48px;height:48px;border-radius:50%;border:1px solid var(--sage);background:transparent;cursor:pointer;display:grid;place-items:center;color:var(--ink);transition:background .4s var(--ease)}
.w-ctrl button.arrow:hover{background:var(--ivory)}
.w-count{font-family:var(--display);font-style:italic;color:var(--taupe);min-width:56px;text-align:center}

/* ---------- work ---------- */
.work{padding:170px 0 150px}
.work-head{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:end;margin-bottom:90px}
.work-head p{color:var(--taupe);max-width:40ch;justify-self:end}
.work-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:28px;row-gap:70px}
.wk{margin:0}
.wk .ph-img{aspect-ratio:3/4}
.wk.tall .ph-img{aspect-ratio:3/4.4}
.wk figcaption{margin-top:16px}
.wk figcaption .label{display:block;margin-bottom:2px;font-size:11px}
.wk figcaption b{font-family:var(--display);font-weight:400;font-size:20px}
.wk:hover img{transform:scale(1.04)}
.wk1{grid-column:1 / span 5}
.wk2{grid-column:7 / span 3;margin-top:120px}
.wk3{grid-column:10 / span 3;margin-top:20px}
.wk4{grid-column:2 / span 3;margin-top:-40px}
.wk5{grid-column:6 / span 4;margin-top:60px}
.wk6{grid-column:10 / span 3;margin-top:-60px}
.wk7{grid-column:4 / span 5;margin-top:10px}
.work-cta{display:flex;justify-content:center;gap:30px;align-items:center;margin-top:90px;flex-wrap:wrap}

/* ---------- guides ---------- */
.guides{padding:40px 0 150px}
.g-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:46px;gap:30px}
.g-head h2{font-size:clamp(34px,3.6vw,52px)}
.g-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px}
.g-card{text-decoration:none;display:block;background:var(--blush-2);transition:transform .6s var(--ease),background .6s var(--ease)}
.g-card:hover{transform:translateY(-6px);background:var(--blush)}
.g-card .g-img{aspect-ratio:4/3;overflow:hidden}
.g-card img{width:100%;height:100%;object-fit:cover;transition:transform 1.4s var(--ease)}
.g-card:hover img{transform:scale(1.05)}
.g-card .g-body{padding:24px 26px 30px}
.g-card h3{font-size:24px;line-height:1.2;margin:8px 0 12px}
.g-card p{font-size:15px;color:var(--taupe)}
.g-card .more{display:inline-block;margin-top:18px;font-size:11px;letter-spacing:.2em;text-transform:uppercase}

/* ---------- booking ---------- */
.book{padding:150px 0 170px}
.b-grid{display:grid;grid-template-columns:1.25fr .75fr;gap:clamp(40px,6vw,96px);align-items:start}
.book h2{margin-bottom:16px}
.book .intro{max-width:46ch}
.price{margin:26px 0 40px;display:flex;gap:10px 22px;flex-wrap:wrap;font-size:14px;color:var(--taupe)}
.price b{font-weight:400;color:var(--ink)}
fieldset{border:0;margin:0;padding:0}
legend{padding:0;margin-bottom:14px}
.svc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:36px}
.svc label{position:relative;display:block;padding:18px 20px 18px 50px;background:var(--ivory);border:1px solid transparent;cursor:pointer;transition:border-color .4s var(--ease),background .4s var(--ease)}
.svc input{position:absolute;opacity:0;pointer-events:none}
.svc label::before{content:"";position:absolute;left:20px;top:22px;width:14px;height:14px;border-radius:50%;border:1px solid var(--sage);transition:box-shadow .4s var(--ease),background .4s}
.svc input:checked+label{border-color:var(--sage)}
.svc input:checked+label::before{background:var(--peach);box-shadow:inset 0 0 0 3px var(--ivory)}
.svc input:focus-visible+label{outline:2px solid var(--peach-d);outline-offset:2px}
.svc b{display:block;font-family:var(--display);font-weight:400;font-size:19px}
.svc small{display:block;font-size:13.5px;color:var(--taupe);line-height:1.45;margin-top:4px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:22px 22px}
.field{display:flex;flex-direction:column;gap:8px}
.field.full{grid-column:1 / -1}
.field label{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--taupe)}
.field input,.field select,.field textarea{font:inherit;font-weight:300;color:var(--ink);background:transparent;border:0;border-bottom:1px solid rgba(59,42,38,.35);padding:10px 2px;border-radius:0;min-height:46px;transition:border-color .4s}
.field textarea{min-height:96px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-bottom-color:var(--peach-d)}
.form-foot{display:flex;align-items:center;gap:24px;margin-top:38px;flex-wrap:wrap}
.form-foot small{color:var(--taupe);font-size:13px}
.thanks{display:none;padding:50px 0}
.thanks h3{font-size:44px;margin-bottom:14px}
.sent .thanks{display:block}
.sent form{display:none}
.b-aside{position:sticky;top:110px;z-index:2}
.b-aside .arch-wrap{height:min(520px,58vh)}
.b-aside .arch img{transition:opacity .7s var(--ease),transform 1.8s var(--ease)}
.b-aside .arch img.fade{opacity:0}
.b-aside .s-title{font-family:var(--display);font-size:26px;margin-top:26px}
.b-aside .s-quote{font-family:var(--display);font-style:italic;font-size:17px;color:var(--taupe);margin-top:10px;line-height:1.5;min-height:3em}
.bow{position:absolute;left:-74px;top:-58px;width:120px;height:120px;z-index:5}
.bow path{fill:none;stroke:var(--silk-edge);stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.bow .bandp{stroke:var(--silk);stroke-width:7}
html.js:not(.rm) .bow path{stroke-dasharray:1 1;stroke-dashoffset:1;transition:stroke-dashoffset 1.6s var(--ease) calc(var(--i) * 140ms)}
html.js:not(.rm) .bow.in path{stroke-dashoffset:0}
.b-aside .bot{right:-26%;top:-70px;width:62%;height:240px;z-index:4}

/* ---------- footer ---------- */
.foot{background:var(--olive);color:var(--ivory);padding:110px 0 40px;position:relative;overflow:hidden}
.foot a{color:var(--ivory)}
.f-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:40px}

.foot h4{margin:0 0 16px;font-size:11px;letter-spacing:.22em;text-transform:uppercase;font-weight:400;color:#C9D0BC}
.foot p,.foot li{font-size:15px}
.foot ul{list-style:none;padding:0;margin:0}
.foot li+li{margin-top:6px}
.f-bottom{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-top:90px;padding-top:24px;border-top:1px solid rgba(250,246,241,.18);font-size:12.5px;color:#C9D0BC}
.totop{position:absolute;right:calc(var(--pad) + 10px);top:0;display:flex;flex-direction:column;align-items:center;text-decoration:none;font-size:10.5px;letter-spacing:.24em;text-transform:uppercase}
.totop svg{width:30px;height:150px;overflow:visible;transform-origin:50% 0;transition:transform .8s var(--ease)}

function split(el){
  var i = 0;
  (function walk(node){
    Array.prototype.slice.call(node.childNodes).forEach(function(n){
      if (n.nodeType === 3){
        var parts = n.textContent.split(/(\s+)/), frag = document.createDocumentFragment();
        parts.forEach(function(p){
          if (!p) return;
          if (/^\s+$/.test(p)) { frag.appendChild(document.createTextNode(p)); return; }
          var s = document.createElement('span'); s.className = 'w'; s.style.setProperty('--i', i++); s.textContent = p; frag.appendChild(s);
        });
        node.replaceChild(frag, n);
      } else if (n.nodeType === 1 && n.tagName !== 'BR' && !n.classList.contains('w')) walk(n);
    });
  })(el);
}

      if (p.leaf){ cx.fillStyle = 'rgba(140,151,122,'+(a*.8)+')'; cx.ellipse(0,0,p.s*.45,p.s*1.9,0,0,6.283); }
      else { cx.fillStyle = p.c+(a*.85)+')'; cx.ellipse(0,0,p.s,p.s*.62,0,0,6.283); }
      cx.fill(); cx.restore();
    }
    if (ps.length) requestAnimationFrame(tick); else { running = false; cx.clearRect(0,0,innerWidth,innerHeight); }
  }
}
})();
